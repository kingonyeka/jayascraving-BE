  Admin: job counts for every Bull queue (order, payment, inventory, cart)
  """
  queueStats: QueueStatsResult!

  """Admin: get revenue broken down by period (daily/weekly/monthly)"""
  revenueByPeriod(from: String!, period: String!, to: String!): [RevenuePeriod!]!

  """Admin: get revenue overview for a date range"""
  revenueOverview(from: String!, to: String!): RevenueOverview!

  """Admin: get a single setting by key"""
  setting(key: String!): Setting!

  """Admin: get a staff member by ID"""
  staffMember(id: ID!): Staff!

  """Admin: get top selling products"""
  topProducts(from: String!, limit: Int! = 10, to: String!): [TopProduct!]!

  """Validate an invite token and return invite details"""
  validateInviteToken(token: String!): StaffInvite!

  """Validate and preview a promo code discount"""
  validatePromoCode(code: String!, deliveryFee: Float! = 0, orderSubtotal: Float!): PromoValidationResult!
}

